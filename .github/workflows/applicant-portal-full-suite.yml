name: Applicant Portal Full Suite

on:
  pull_request:
    paths:
      - 'app/**'
      - 'routes/**'
      - 'database/**'
      - 'resources/views/**'
      - 'tests/**'
      - '.github/workflows/applicant-portal-full-suite.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

jobs:
  laravel-suite:
    name: Full PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Full PHPUnit suite
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CACHE_DRIVER: array
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php artisan test --testdox
      - name: Legacy applications table migration contract
        run: |
          if grep -R -n -E "Schema::(table|drop|rename)\(['\"]applications['\"]" database/migrations/2026_10_18_*.php; then
            echo "Applicant portal migrations must not modify legacy applications table."
            exit 1
          fi
          echo "Applicant portal migrations do not alter applications."
